interface:
  display_name: "Flow UI Architect"
  short_description: "Design, review and build coherent task-first UI"
  default_prompt: "Use $flow-ui-architect. Follow every required step in its ledger and read/apply each routed reference before making the decision. Complete the Art Direction Gate, Spatial Orchestration Gate and UI Engineering Quality Gate before declaring the UI complete: record bounded user-perception hypotheses, visual grammar, space roles, layout skeleton, V0–V4 lifecycle, collapse/expand, persistence, responsive transformation, state restoration, geometry, spacing owner, overflow/scroll, stacking/Portal, collision, focus/hit-testing, async stability and platform checks for every major region, panel, floating element and feedback layer. Do not skip a decision because the page is simple or a component already exists. Include page element blueprints, realistic-content and anti-AI review, browser runtime audit and cross-page Review/Repair when multiple pages are involved."
