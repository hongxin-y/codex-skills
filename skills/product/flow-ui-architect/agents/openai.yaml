interface:
  display_name: "Flow UI Architect"
  short_description: "Design, review and build coherent task-first UI"
  default_prompt: "Use $flow-ui-architect. Follow every required step in its ledger and read/apply each routed reference before making the decision. For visual DESIGN, BUILD or visual changes, use Image Generation first: create V0, iterate to V1 and V2, record prompts/decision changes/reviews/rejected versions, and obtain an explicit reference approval before continuing. Then complete the Art Direction, Spatial Orchestration and UI Engineering gates: record bounded user-perception hypotheses, visual grammar, space roles, layout skeleton, V0–V4 lifecycle, collapse/expand, persistence, responsive transformation, state restoration, geometry, spacing owner, overflow/scroll, stacking/Portal, collision, focus/hit-testing, async stability and platform checks for every major region, panel, floating element and feedback layer. Do not write UI code until the approved reference, all pre-code design/validation steps and Engineering Blueprint are complete. If image generation or inspection is unavailable, mark BLOCKED and do not substitute screenshots or HTML. Include page element blueprints, realistic-content and anti-AI review, browser runtime audit and cross-page Review/Repair when multiple pages are involved."
