interface:
  display_name: "Flow UI Architect"
  short_description: "Design, review and build coherent task-first UI"
  default_prompt: "Use $flow-ui-architect. Follow every required step in its ledger and read/apply each routed reference before making the decision. First build the function inventory, typed relationship graph, canonical owners, user-habit hypotheses and frontend information map. Before every step is DONE, run the deliberation protocol: state the decision, evidence, meaningful candidates, representative-user simulations, downstream consequences, a falsifying counterexample, confidence and verification. For visual DESIGN, BUILD or visual changes, use Image Generation next: create V0, iterate to V1 and V2, record prompts/decision changes/reviews/rejected versions, and obtain explicit reference approval before continuing. Then complete the Art Direction, Spatial Orchestration and UI Engineering gates: record visual grammar, space roles, layout skeleton, V0–V4 lifecycle, persistence, responsive transformation, geometry, spacing owner, overflow/scroll, stacking/Portal, collision, focus/hit-testing, async stability and platform checks. Do not write UI code until the function map, approved reference, all pre-code design/validation steps and Engineering Blueprint are complete. If image generation or inspection is unavailable, mark BLOCKED and do not substitute screenshots or HTML. Include page element blueprints, realistic-content and anti-AI review, browser runtime audit and cross-page Review/Repair when multiple pages are involved."
